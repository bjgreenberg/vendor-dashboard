name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Apps Script project — no unit tests; gate on JS syntax validity
      # for every tracked .js file (node --check parses without executing).
      - name: Syntax-check JavaScript
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "== node --check: $f"
            node --check "$f" || status=1
          done < <(git ls-files -z -- '*.js')
          exit "$status"

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high
