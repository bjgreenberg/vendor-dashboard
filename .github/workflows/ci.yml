name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Apps Script project — no unit tests; gate on JS syntax validity
      # for every tracked .js file (node --check parses without executing).
      - name: Syntax-check JavaScript
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "== node --check: $f"
            node --check "$f" || status=1
          done < <(git ls-files -z -- '*.js')
          exit "$status"

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

  # Render-check every ```mermaid block in the repo's Markdown. A diagram that
  # fails to render is a broken deliverable (a red box for every reader), so it
  # is gated like a test. Uses the digest-pinned mermaid-cli container — no Node
  # or Chrome on the runner. Docker is preinstalled on ubuntu-latest.
  docs-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render-check Mermaid diagrams
        run: scripts/render-diagrams.sh
