name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Every tracked .py file, --strict (setup.cfg [mypy], files = .). The
      # same script runs locally; it pins mypy and Pillow and installs them
      # into .venv.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Type check (mypy --strict, every .py file)
        run: scripts/typecheck.sh

      - name: Install dependencies
        run: npm ci

      # Real unit tests, every adapter pinned against a recorded vendor
      # payload. Coverage is a GATE, not a report: vitest exits non-zero when
      # a threshold is missed. BRANCH coverage, per-file — an untested catch
      # block is how a vendor silently reads green.
      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      # Catch bundling/binding errors without deploying. --no-install: the
      # lockfile-pinned wrangler, never a fetched-latest one.
      - name: Build check (wrangler dry-run)
        run: npx --no-install wrangler deploy --dry-run --outdir=/tmp/build

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high
