name: Scorecard supply-chain security

# OpenSSF Scorecard — assesses supply-chain security posture (pinned deps,
# branch protection, token permissions, etc.) and publishes results so the
# Scorecard badge renders.
#
# INERT WHILE PRIVATE: Scorecard publishing and the code-scanning SARIF upload
# require a PUBLIC repository. The job is guarded on repo visibility, so while
# the repo is private every trigger is a clean skip (no red X). On the first
# push to main AFTER the repo is made public, it runs and the badge activates.

on:
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write   # upload the SARIF result to code scanning
      id-token: write          # publish results to the OpenSSF API (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
