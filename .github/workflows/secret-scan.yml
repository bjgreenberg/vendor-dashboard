name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Secret-scan the full git history AND the working tree. Complements
  # Scorecard. Digest-pinned gitleaks container; runs as root inside the
  # ephemeral container to avoid git "dubious ownership" on the mounted repo.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # full history for the git-log scan

      - name: gitleaks (history + tree)
        run: |
          docker run --rm -v "$PWD:/repo" --user root \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner
