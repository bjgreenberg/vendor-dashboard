[mypy]
# Every Python file in the repo (Brian, 2026-10-29), all --strict. Today that is
# scripts/make-social-card.py; a new .py file anywhere is checked the day it
# lands. Only the venvs, node_modules, build output and tool caches are left
# out. Run with scripts/typecheck.sh (local and CI).
files = .
exclude = (?x)^(venv|\.venv|node_modules|build|dist|coverage|reports|\.hypothesis|mutants)/
python_version = 3.14
strict = True
warn_unreachable = True
